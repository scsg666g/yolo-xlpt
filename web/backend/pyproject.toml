[project]
name = "yolo-training-platform"
version = "1.12.1"
description = "Standalone training orchestration API for the local Ultralytics workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
